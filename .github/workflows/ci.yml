name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"  # same as the add-on Dockerfile
          cache: pip
          cache-dependency-path: |
            rezeptplaner/backend/requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r rezeptplaner/backend/requirements.txt -r requirements-dev.txt

      - name: Backend tests
        run: pytest -q

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Frontend checks (imports, window handlers, syntax)
        run: python scripts/check_frontend.py
